<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur immobilier bi-modal — Néo-banque clair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NÉO-BANQUE CLAIR — Design system
   ============================================================ */
:root {
  /* Surfaces & ink */
  --bg-screen:   #F1F2F9;
  --surface:     #FFFFFF;
  --ink:         #191A2C;
  --ink-2:       #73748A;
  --track:       #ECEDF4;

  /* Brand */
  --accent:      #5B5BF0;
  --accent-soft: #ECECFE;
  --accent-tint: #E6E7F2;

  /* Semantic */
  --pos:      #16A36A;  --pos-bg:  #E4F6ED;
  --warn:     #D9930B;  --warn-bg: #FBF1DD;
  --neg:      #E0524A;  --neg-bg:  #FCE9E7;
  --teal:     #0E8C86;

  /* Depth */
  --shadow: 0 6px 22px rgba(28,30,80,0.07);
  --shadow-pill: 0 2px 6px rgba(28,30,80,0.10);

  /* Radii */
  --r-lg: 24px;
  --r-md: 18px;
  --r-sm: 14px;
  --r-xs: 9px;

  /* Type */
  --sans: "Plus Jakarta Sans", system-ui, sans-serif;
  --mono: "Spline Sans Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  color: var(--ink);
  background:
    radial-gradient(1200px 700px at 50% -10%, #FBFBFE 0%, #E7E8F1 60%, #DFE0EC 100%);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- Review stage ---------- */
.stage {
  display: flex;
  flex-wrap: wrap;
  gap: 56px;
  justify-content: center;
  align-items: flex-start;
  padding: 64px 40px 96px;
}
.stage-head {
  width: 100%;
  text-align: center;
  margin-bottom: 8px;
}
.stage-head h1 {
  font-size: 19px; font-weight: 800; letter-spacing: -0.01em;
  color: #2A2B45;
}
.stage-head p {
  margin-top: 6px; font-size: 13px; color: #84859A; font-weight: 500;
}
.frame-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.frame-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: #9899AD; display: flex; align-items: center; gap: 8px;
}
.frame-label .num {
  background: var(--accent); color: #fff; width: 20px; height: 20px;
  border-radius: 7px; display: grid; place-items: center; font-size: 11px;
}

/* ---------- Phone shell ---------- */
.phone {
  width: 390px; height: 844px;
  background: var(--bg-screen);
  border-radius: 46px;
  padding: 11px;
  box-shadow:
    0 0 0 11px #1b1c2b,
    0 0 0 13px #2c2d42,
    0 40px 80px -28px rgba(20,21,40,0.55);
  position: relative;
}
.screen {
  width: 100%; height: 100%;
  background: var(--bg-screen);
  border-radius: 36px;
  overflow: hidden;
  position: relative;
  display: flex; flex-direction: column;
}

/* status bar */
.statusbar {
  height: 50px; flex: none;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 30px 0 34px;
  font-size: 14px; font-weight: 700;
  position: relative; z-index: 5;
}
.statusbar .time { letter-spacing: 0.01em; }
.statusbar .icons { display: flex; align-items: center; gap: 7px; }
.statusbar .icons svg { display: block; }
.notch {
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
  width: 120px; height: 32px; background: #14151f; border-radius: 18px; z-index: 6;
}

/* scroll body */
.body {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 4px 16px 92px;
  scrollbar-width: none;
}
.body::-webkit-scrollbar { display: none; }

/* home indicator */
.home-ind {
  position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%);
  width: 134px; height: 5px; border-radius: 3px; background: rgba(25,26,44,0.32);
  z-index: 7;
}

/* ============================================================
   GENERIC PRIMITIVES
   ============================================================ */
.overline {
  font-size: 11px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--accent);
}
.card {
  background: var(--surface);
  border-radius: var(--r-md);
  box-shadow: var(--shadow);
  padding: 16px;
}
.card.lg { border-radius: var(--r-lg); }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

.kpi-label {
  font-size: 10.5px; font-weight: 600; color: var(--ink-2);
  letter-spacing: 0.01em; line-height: 1.25;
}
.kpi-value { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; margin-top: 9px; }
.kpi-foot { font-size: 10.5px; font-weight: 600; color: var(--ink-2); margin-top: 8px; }

/* chips */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--accent-soft); color: var(--accent);
  font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 10px;
}
.chip-row { display: flex; flex-wrap: wrap; gap: 7px; }

/* buttons */
.btn {
  width: 100%; border: none; cursor: pointer; font-family: var(--sans);
  font-size: 15px; font-weight: 700; border-radius: var(--r-sm);
  padding: 13px 16px; display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .12s ease, box-shadow .2s ease, background .2s ease;
}
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 8px 18px -6px rgba(91,91,240,0.6); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 22px -6px rgba(91,91,240,0.7); }
.btn-secondary { background: var(--bg-screen); color: var(--ink); }
.btn-secondary:hover { background: #E8E9F3; }

/* badges A / B */
.mode-badge {
  width: 40px; height: 40px; border-radius: 13px; flex: none;
  display: grid; place-items: center; font-size: 19px; font-weight: 800;
  background: var(--accent-soft); color: var(--accent);
}

/* semantic pills */
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

.disclaimer {
  font-size: 9.5px; line-height: 1.4; color: #9C9DB0; font-weight: 500;
  text-align: center; padding: 4px 6px;
}

/* ============================================================
   APP NAVIGABLE — styles spécifiques au prototype
   (s'appuie sur styles.css pour les tokens)
   ============================================================ */

/* ---------- Stage centré (un seul téléphone) ---------- */
.app-stage {
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 22px; padding: 40px 20px;
}
.app-stage .hint {
  font-size: 12px; font-weight: 600; color: #9899AD; letter-spacing: 0.01em;
  display: flex; align-items: center; gap: 8px;
}
.app-stage .hint kbd {
  font-family: var(--mono); font-size: 11px; background: #fff; border-radius: 6px;
  padding: 2px 7px; box-shadow: var(--shadow); color: var(--ink);
}

/* ---------- App chrome inside phone ---------- */
.app-root { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; }

/* top app bar */
.appbar {
  flex: none; display: flex; align-items: center; gap: 10px;
  padding: 2px 16px 10px;
}
.appbar .back {
  width: 34px; height: 34px; border-radius: 11px; border: none; cursor: pointer;
  background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center;
  color: var(--ink); transition: background .15s;
}
.appbar .back:hover { background: #F4F4FB; }
.appbar .ab-titles { flex: 1; min-width: 0; }
.appbar .ab-kicker { font-size: 9.5px; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); }
.appbar .ab-title { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin-top: 1px; }
.appbar .ab-step { font-size: 10px; font-weight: 700; color: var(--ink-2); font-family: var(--mono); }

/* page transition */
.page { animation: pageIn .28s cubic-bezier(.22,.7,.3,1) both; }
@keyframes pageIn { from { transform: translateY(10px); } to { transform: none; } }

/* progress dots for forms */
.steps { display: flex; gap: 5px; padding: 0 16px 10px; }
.steps i { height: 4px; flex: 1; border-radius: 3px; background: var(--track); transition: background .25s; }
.steps i.on { background: var(--accent); }
.steps i.done { background: #BFC0F6; }

/* sticky footer CTA */
.footer-cta {
  flex: none; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg-screen) 72%, rgba(241,242,249,0));
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 8;
}
.footer-cta .btn { box-shadow: 0 8px 20px -6px rgba(91,91,240,0.55); }
.footer-cta.dual { display: flex; gap: 10px; }
.footer-cta.dual .btn { width: auto; flex: 1; }

/* ---------- Form fields ---------- */
.field { margin-bottom: 12px; }
.field > label {
  display: block; font-size: 11px; font-weight: 700; color: var(--ink-2);
  margin: 0 2px 6px; letter-spacing: 0.01em;
}
.input-wrap {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border-radius: var(--r-sm);
  box-shadow: var(--shadow); padding: 0 14px;
  border: 1.5px solid transparent; transition: border-color .15s, box-shadow .15s;
}
.input-wrap:focus-within { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 4px var(--accent-soft); }
.input-wrap input {
  flex: 1; min-width: 0; border: none; outline: none; background: transparent;
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: 16px; font-weight: 600; color: var(--ink); padding: 12px 0;
  text-align: right;
}
.input-wrap input::-webkit-outer-spin-button,
.input-wrap input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.input-wrap input[type=number] { -moz-appearance: textfield; }
.input-wrap .unit { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--ink-2); flex: none; }
.input-wrap .lead { font-size: 13px; font-weight: 700; color: var(--ink-2); flex: none; }

/* text/select field */
.input-wrap.text input { text-align: left; font-family: var(--sans); font-size: 15px; font-weight: 600; }
.seg-choice { display: flex; gap: 6px; }
.seg-choice button {
  flex: 1; border: none; cursor: pointer; font-family: var(--sans);
  font-size: 12.5px; font-weight: 700; padding: 11px 6px; border-radius: var(--r-xs);
  background: var(--surface); color: var(--ink-2); box-shadow: var(--shadow); transition: all .15s;
}
.seg-choice button.on { background: var(--accent); color: #fff; box-shadow: 0 6px 14px -5px rgba(91,91,240,.6); }

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-row.three { grid-template-columns: 1fr 1fr 1fr; }
.field-row > *, .row2 > *, .row3 > * { min-width: 0; }
.field-row .field { margin-bottom: 0; }
.input-wrap input { width: 100%; }

.group-label {
  font-size: 10.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
  color: #9899AD; margin: 18px 2px 10px; display: flex; align-items: center; gap: 8px;
}
.group-label::after { content: ""; flex: 1; height: 1px; background: var(--track); }
.group-label:first-child { margin-top: 4px; }

/* slider field */
.slider-field .sf-top { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px; }
.slider-field .sf-top label { font-size: 11px; font-weight: 700; color: var(--ink-2); }
.slider-field .sf-top .sf-val { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--accent); }
input[type=range].slider {
  -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 4px;
  background: var(--track); outline: none;
}
input[type=range].slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); cursor: pointer; box-shadow: 0 3px 8px rgba(91,91,240,.5);
  border: 3px solid #fff;
}
input[type=range].slider::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 3px solid #fff;
}

/* small note under field */
.field-note { font-size: 9.5px; font-weight: 500; color: #9C9DB0; margin: 5px 2px 0; line-height: 1.35; }
.field-note.warn { color: var(--warn); }

/* ---------- Selector cards (reuse from screen 1) ---------- */
.sel-flow .reassure {
  display: flex; gap: 9px; align-items: flex-start; background: var(--surface);
  border-radius: var(--r-sm); padding: 11px 13px; box-shadow: var(--shadow); margin-bottom: 16px;
}
.sel-flow .reassure svg { flex: none; margin-top: 1px; }
.sel-flow .reassure p { font-size: 12px; line-height: 1.4; color: var(--ink-2); font-weight: 500; }
.mode-card { position: relative; margin-bottom: 12px; cursor: pointer; transition: transform .14s, box-shadow .2s; }
.mode-card:active { transform: scale(.99); }
.mode-card.active { box-shadow: var(--shadow), 0 0 0 2px var(--accent); }
.mc-top { display: flex; align-items: center; gap: 12px; }
.mc-titles { flex: 1; min-width: 0; }
.mc-name { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
.mc-horizon { font-size: 11px; font-weight: 600; color: var(--ink-2); margin-top: 2px; }
.mc-pitch { font-size: 12.5px; line-height: 1.45; color: #43445C; font-weight: 500; margin: 13px 0; }
.mode-card .chip-row { margin-bottom: 14px; }
.mc-flag {
  position: absolute; top: 14px; right: 14px; font-size: 9.5px; font-weight: 800;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);
  background: var(--accent-soft); padding: 4px 8px; border-radius: 7px;
}
.s1-head { padding: 4px 4px 16px; }
.s1-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.1; margin-top: 9px; text-wrap: balance; }

/* ---------- Dashboard pieces (shared) ---------- */
.dash-header { display: flex; align-items: center; gap: 12px; padding: 0 2px 14px; }
.dh-titles { flex: 1; min-width: 0; }
.dh-name { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.dh-sub { font-size: 11.5px; font-weight: 600; color: var(--ink-2); margin-top: 2px; }
.avatar { width: 44px; height: 44px; border-radius: 14px; flex: none; background: var(--accent-soft);
  color: var(--accent); display: grid; place-items: center; font-size: 14px; font-weight: 800; }

.seg { display: flex; gap: 4px; background: var(--accent-tint); border-radius: 16px; padding: 4px; margin-bottom: 14px; }
.seg button { flex: 1; border: none; cursor: pointer; font-family: var(--sans); background: transparent;
  border-radius: 12px; padding: 9px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  transition: background .2s, box-shadow .2s; }
.seg button .seg-title { font-size: 13px; font-weight: 700; color: var(--ink-2); letter-spacing: -0.01em; }
.seg button .seg-sub { font-size: 9.5px; font-weight: 600; color: #A2A3B6; }
.seg button.on { background: var(--surface); box-shadow: var(--shadow-pill); }
.seg button.on .seg-title { color: var(--ink); }
.seg button.on .seg-sub { color: var(--accent); }

.verdict { display: flex; align-items: center; gap: 11px; border-radius: var(--r-md); padding: 14px 16px; margin-bottom: 12px; }
.verdict.pos { background: var(--pos-bg); } .verdict.pos .v-dot { background: var(--pos); } .verdict.pos .v-label { color: #0F7A50; } .verdict.pos .v-value { color: var(--pos); }
.verdict.warn { background: var(--warn-bg); } .verdict.warn .v-dot { background: var(--warn); } .verdict.warn .v-label { color: #A9760C; } .verdict.warn .v-value { color: var(--warn); }
.verdict.neg { background: var(--neg-bg); } .verdict.neg .v-dot { background: var(--neg); } .verdict.neg .v-label { color: #C0413A; } .verdict.neg .v-value { color: var(--neg); }
.v-dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.v-label { font-size: 14px; font-weight: 700; flex: 1; }
.v-value { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }

.kpi-pos { background: var(--pos-bg); } .kpi-pos .kpi-label, .kpi-pos .kpi-foot { color: #2E8C61; } .kpi-pos .kpi-value { color: var(--pos); }
.kpi-warn { background: var(--warn-bg); } .kpi-warn .kpi-label, .kpi-warn .kpi-foot { color: #A9760C; } .kpi-warn .kpi-value { color: var(--warn); }
.kpi-neg { background: var(--neg-bg); } .kpi-neg .kpi-label, .kpi-neg .kpi-foot { color: #C0413A; } .kpi-neg .kpi-value { color: var(--neg); }
.sect-gap { margin-bottom: 12px; }

.cf-card { display: flex; flex-direction: column; }
.minibars { display: flex; align-items: flex-end; gap: 3px; height: 40px; margin-top: 14px; }
.minibars span { flex: 1; border-radius: 3px 3px 2px 2px; background: var(--track); transition: height .3s; }

.donut-card { display: flex; flex-direction: column; align-items: center; }
.donut-wrap { position: relative; width: 104px; height: 104px; margin: 6px 0 4px; }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.dc-val { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.dc-cap { font-size: 9px; font-weight: 700; color: var(--ink-2); letter-spacing: 0.04em; text-transform: uppercase; margin-top: 1px; }
.donut-legend { font-size: 10.5px; font-weight: 600; color: var(--ink-2); }
.donut-legend b { color: var(--ink); font-family: var(--mono); font-weight: 600; }

.gauge-head { display: flex; align-items: baseline; justify-content: space-between; }
.gauge-head .g-val { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.gauge-track { position: relative; height: 14px; border-radius: 8px; background: var(--track); margin: 30px 0 10px; }
.gauge-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; transition: width .4s, background .3s; }
.gauge-fill.pos { background: var(--pos); } .gauge-fill.warn { background: var(--warn); } .gauge-fill.neg { background: var(--neg); }
.gauge-marker { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--neg); }
.gauge-marker::after { content: attr(data-label); position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
  font-size: 9px; font-weight: 800; color: var(--neg); font-family: var(--mono); white-space: nowrap; }
.gauge-foot { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 600; color: var(--ink-2); }
.gauge-foot b { color: var(--ink); font-family: var(--mono); font-weight: 600; }

.proj-legend { display: flex; gap: 16px; margin-top: 12px; }
.proj-legend span { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; color: var(--ink-2); }
.lg-swatch { width: 16px; height: 0; border-top: 3px solid; border-radius: 2px; }
.lg-dash { border-top: 3px dashed; }

.hypo-row { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; }
.hypo-chip { display: inline-flex; align-items: center; gap: 7px; background: var(--accent-soft); border-radius: 11px; padding: 7px 11px; cursor: pointer; }
.hypo-chip.warn { background: var(--warn-bg); }
.hc-val { font-size: 11px; font-weight: 700; color: var(--accent); font-family: var(--mono); }
.hypo-chip.warn .hc-val { color: #A9760C; }
.hc-edit { font-size: 11px; font-weight: 700; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.hypo-note { flex: 1; font-size: 9px; line-height: 1.35; color: #9C9DB0; font-weight: 500; text-align: right; }

.card-title { font-size: 13px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
.card-sub { font-size: 10.5px; font-weight: 600; color: var(--ink-2); margin-top: 2px; }

/* ---------- Régimes comparatif ---------- */
.regime-card { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; cursor: pointer; transition: box-shadow .2s, transform .12s; }
.regime-card:active { transform: scale(.99); }
.regime-card.best { box-shadow: var(--shadow), 0 0 0 2px var(--pos); }
.regime-card.sel { box-shadow: var(--shadow), 0 0 0 2px var(--accent); }
.rc-left { flex: 1; min-width: 0; }
.rc-name { font-size: 14px; font-weight: 800; letter-spacing: -0.01em; }
.rc-detail { font-size: 10.5px; font-weight: 600; color: var(--ink-2); margin-top: 2px; }
.rc-right { text-align: right; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.regime-card { align-items: flex-start; }
.rc-cf { font-size: 17px; font-weight: 600; font-family: var(--mono); letter-spacing: -0.01em; }
.rc-rdt { font-size: 10px; font-weight: 600; color: var(--ink-2); font-family: var(--mono); margin-top: 2px; }
.rc-tag { font-size: 9px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--pos);
  background: var(--pos-bg); padding: 3px 7px; border-radius: 6px; }

/* ---------- Scénarios / stress ---------- */
.stress-row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--track); }
.stress-row:last-child { border-bottom: none; }
.stress-row .sr-icon { width: 32px; height: 32px; border-radius: 10px; flex: none; display: grid; place-items: center; font-family: var(--mono); font-size: 13px; font-weight: 700; }
.sr-icon.pos { background: var(--pos-bg); color: var(--pos); } .sr-icon.warn { background: var(--warn-bg); color: var(--warn); } .sr-icon.neg { background: var(--neg-bg); color: var(--neg); }
.sr-mid { flex: 1; min-width: 0; }
.sr-label { font-size: 13px; font-weight: 700; }
.sr-delta { font-size: 10.5px; font-weight: 600; color: var(--ink-2); font-family: var(--mono); margin-top: 1px; }
.sr-val { text-align: right; flex: none; }
.sr-main { font-size: 15px; font-weight: 600; font-family: var(--mono); }
.sr-sub { font-size: 10px; font-weight: 600; color: var(--ink-2); font-family: var(--mono); }

.scen-tri { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.scen-cell { background: var(--surface); border-radius: var(--r-sm); box-shadow: var(--shadow); padding: 12px 10px; text-align: center; }
.scen-cell.med { box-shadow: var(--shadow), 0 0 0 2px var(--accent); }
.scen-cap { font-size: 9.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); }
.scen-big { font-size: 16px; font-weight: 600; font-family: var(--mono); margin-top: 6px; letter-spacing: -0.01em; }
.scen-small { font-size: 10px; font-weight: 600; font-family: var(--mono); color: var(--ink-2); margin-top: 3px; }

/* ---------- Report preview ---------- */
.report-pages { display: flex; flex-direction: column; gap: 14px; }
.rp-page { background: #fff; border-radius: 10px; box-shadow: var(--shadow); padding: 16px; position: relative; }
.rp-page::before { content: attr(data-page); position: absolute; top: 12px; right: 14px; font-family: var(--mono); font-size: 9px; font-weight: 700; color: #C2C3D4; }
.rp-brand { display: flex; align-items: center; gap: 8px; padding: 0 24px 10px 0; border-bottom: 1.5px solid var(--track); margin-bottom: 12px; }
.rp-logo { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); flex: none; }
.rp-brand-name { font-size: 12px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; }
.rp-brand-sub { font-size: 9px; font-weight: 600; color: var(--ink-2); margin-top: 2px; }
.rp-brand > div { flex: 1; min-width: 0; }
.rp-h { font-size: 13px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.01em; }
.rp-kpis { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
.rp-kpi { background: var(--bg-screen); border-radius: 9px; padding: 9px; }
.rp-kpi .k { font-size: 8px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.rp-kpi .v { font-size: 14px; font-weight: 600; font-family: var(--mono); margin-top: 3px; }
.rp-line { display: flex; justify-content: space-between; font-size: 11px; padding: 6px 0; border-bottom: 1px dashed var(--track); }
.rp-line:last-child { border-bottom: none; }
.rp-line .l { color: var(--ink-2); font-weight: 600; }
.rp-line .v { font-family: var(--mono); font-weight: 600; }
.rp-line.total { border-top: 1.5px solid var(--ink); border-bottom: none; margin-top: 4px; padding-top: 8px; font-weight: 800; }
.rp-line.total .l { color: var(--ink); font-weight: 800; }
.rp-disclaimer { font-size: 8px; color: #A2A3B6; text-align: center; margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--track); line-height: 1.4; }

/* download bar */
.dl-bar { display: flex; gap: 10px; align-items: center; background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 13px 14px; margin-bottom: 14px; }
.dl-bar .dl-ic { width: 38px; height: 38px; border-radius: 11px; background: var(--accent-soft); display: grid; place-items: center; flex: none; }
.dl-bar .dl-tx { flex: 1; } .dl-bar .dl-tx .t { font-size: 13px; font-weight: 800; } .dl-bar .dl-tx .s { font-size: 10.5px; font-weight: 600; color: var(--ink-2); }

/* generic list rows on dashboard */
.kv-card .kv { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-bottom: 1px dashed var(--track); }
.kv-card .kv:last-child { border-bottom: none; }
.kv-card .kv .k { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.kv-card .kv .v { font-size: 14px; font-weight: 600; font-family: var(--mono); letter-spacing: -0.01em; }

/* toast */
.toast { position: absolute; left: 16px; right: 16px; bottom: 88px; background: var(--ink); color: #fff;
  border-radius: 12px; padding: 12px 14px; font-size: 12px; font-weight: 600; z-index: 20;
  box-shadow: 0 10px 24px rgba(20,21,40,.4); animation: toastIn .3s ease; }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* edit-hypothesis sheet */
.sheet-backdrop { position: absolute; inset: 0; background: rgba(20,21,40,.34); z-index: 30; display: flex; align-items: flex-end;
  animation: fadeIn .2s ease; border-radius: 36px; overflow: hidden; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.sheet { width: 100%; background: var(--bg-screen); border-radius: 26px 26px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom));
  animation: sheetUp .3s cubic-bezier(.22,.7,.3,1); max-height: 80%; overflow-y: auto; }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
.sheet-grab { width: 38px; height: 5px; border-radius: 3px; background: #C9CAD9; margin: 6px auto 14px; }
.sheet h3 { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; }
.sheet .sub { font-size: 11.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 16px; line-height: 1.4; }
.src-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; font-family: var(--mono);
  color: var(--ink-2); background: var(--track); padding: 5px 9px; border-radius: 8px; margin-bottom: 14px; }

/* ---------- Structures juridiques ---------- */
.screen-intro { font-size: 12px; line-height: 1.45; font-weight: 500; color: var(--ink-2); margin: 0 2px 14px; }

.cmp-list { display: flex; flex-direction: column; gap: 11px; }
.cmp-row { display: grid; grid-template-columns: 96px 1fr auto; align-items: center; gap: 10px; }
.cmp-name { font-size: 11px; font-weight: 700; color: var(--ink); line-height: 1.15; }
.cmp-bar { height: 9px; border-radius: 6px; background: var(--track); overflow: hidden; }
.cmp-fill { height: 100%; border-radius: 6px; transition: width .45s cubic-bezier(.22,.7,.3,1); }
.cmp-fill.pos { background: var(--accent); } .cmp-fill.neg { background: var(--neg); }
.cmp-val { font-size: 12px; font-weight: 600; letter-spacing: -0.01em; text-align: right; }
.cmp-val.pos { color: var(--ink); } .cmp-val.neg { color: var(--neg); }

.struct-card { margin-bottom: 10px; cursor: pointer; transition: box-shadow .2s; padding: 14px 15px; }
.struct-card.best { box-shadow: var(--shadow), 0 0 0 1.5px var(--pos); }
.struct-card.sel { box-shadow: var(--shadow), 0 0 0 1.5px var(--accent); }
.struct-head { display: flex; align-items: center; gap: 11px; }
.fam-chip { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  font-size: 11px; font-weight: 800; letter-spacing: 0.02em; }
.fam-chip.ir { background: var(--accent-soft); color: var(--accent); }
.fam-chip.is { background: #E3F2F1; color: var(--teal); }
.struct-titles { flex: 1; min-width: 0; }
.struct-name { font-size: 14px; font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: center; gap: 7px; }
.struct-note { font-size: 10px; font-weight: 600; color: var(--ink-2); margin-top: 2px; line-height: 1.3; }
.struct-right { text-align: right; flex: none; }
.struct-val { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.struct-val.pos { color: var(--ink); } .struct-val.neg { color: var(--neg); }
.struct-tax { font-size: 9.5px; font-weight: 600; color: var(--ink-2); margin-top: 2px; }
.opt-tag { font-size: 8.5px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--pos);
  background: var(--pos-bg); padding: 2px 6px; border-radius: 5px; }
.chev { flex: none; color: #B7B8CC; transition: transform .25s; margin-left: 2px; }
.chev.up { transform: rotate(180deg); }

.struct-detail { margin-top: 14px; padding-top: 13px; border-top: 1px dashed var(--track); animation: pageIn .22s ease; }
.sd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px 14px; }
.sd-cell.wide { grid-column: 1 / -1; }
.sd-cell .k { font-size: 10px; font-weight: 600; color: var(--ink-2); line-height: 1.25; }
.sd-cell .v { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin-top: 4px; }
.sd-cell .v.neg { color: var(--neg); }

/* ---------- Horizon de revente ---------- */
.chip-scroll { display: flex; gap: 7px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -2px; scrollbar-width: none; }
.chip-scroll::-webkit-scrollbar { display: none; }
.struct-chip {
  flex: none; border: none; cursor: pointer; font-family: var(--sans);
  background: var(--surface); box-shadow: var(--shadow); border-radius: 11px;
  padding: 9px 13px; display: flex; align-items: center; gap: 8px; transition: box-shadow .18s, background .18s;
}
.struct-chip .sc-fam { font-size: 9px; font-weight: 800; padding: 2px 5px; border-radius: 5px; }
.struct-chip .sc-fam.ir { background: var(--accent-soft); color: var(--accent); }
.struct-chip .sc-fam.is { background: #E3F2F1; color: var(--teal); }
.struct-chip .sc-name { font-size: 12.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.struct-chip.on { background: var(--accent); box-shadow: 0 6px 14px -5px rgba(91,91,240,.6); }
.struct-chip.on .sc-name { color: #fff; }
.struct-chip.on .sc-fam { background: rgba(255,255,255,.25); color: #fff; }

.timing-hero { background: var(--ink); border-radius: var(--r-lg); padding: 18px 18px 16px; margin-bottom: 12px; color: #fff; }
.timing-hero .th-k { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #A8A9C8; }
.timing-hero .th-v { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; margin-top: 4px; line-height: 1; }
.timing-hero .th-v small { font-size: 16px; font-weight: 700; color: #C9CAE6; }
.timing-hero .th-sub { font-size: 12px; font-weight: 600; color: #C9CAE6; margin-top: 9px; font-family: var(--mono); }
.timing-hero .th-sub b { color: #fff; }

.chart-x { display: flex; justify-content: space-between; font-size: 9px; font-weight: 700; color: #A2A3B6; font-family: var(--mono); margin-top: 4px; padding: 0 2px; }

.hz-table { margin-top: 6px; }
.hz-row { display: grid; grid-template-columns: 56px 1fr 1fr 56px; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px dashed var(--track); }
.hz-row:last-child { border-bottom: none; }
.hz-row.head { padding: 4px 0 8px; border-bottom: 1.5px solid var(--track); }
.hz-row.head span { font-size: 9px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
.hz-row.opt { background: var(--accent-soft); border-radius: 10px; padding: 10px 8px; margin: 2px -8px; border-bottom: none; }
.hz-yr { font-size: 13px; font-weight: 800; font-family: var(--mono); }
.hz-cell { font-size: 13px; font-weight: 600; font-family: var(--mono); letter-spacing: -0.01em; }
.hz-cell.sub { font-size: 11px; color: var(--ink-2); }
.hz-tri { font-size: 13px; font-weight: 700; font-family: var(--mono); text-align: right; color: var(--accent); }
.hz-star { font-size: 9px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }

.note-card { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border-radius: var(--r-sm);
  box-shadow: var(--shadow); padding: 13px 14px; margin-bottom: 12px; }
.note-card svg { flex: none; margin-top: 1px; }
.note-card p { font-size: 11.5px; line-height: 1.45; font-weight: 500; color: #43445C; }

/* ============================================================
   STRATÉGIE DE REMPLOI
   ============================================================ */
.remploi-hero {
  background: linear-gradient(135deg, #5B5BF0 0%, #4747D6 100%);
}
.remploi-hero .th-v { color: #fff; }
.remploi-hero .th-sub { color: #DEDEFB; }
.remploi-hero .th-sub b { color: #fff; }
.remploi-hero .th-k { color: #C7C7FA; }

/* levier : capital → capacité → biens */
.lev-flow { display: flex; align-items: stretch; gap: 8px; }
.lev-step {
  flex: 1; min-width: 0; background: var(--bg-screen); border-radius: var(--r-xs);
  padding: 12px 10px; text-align: center; display: flex; flex-direction: column; gap: 4px; justify-content: center;
}
.lev-step.accent { background: var(--accent-soft); }
.lev-step .ls-k { font-size: 9px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
.lev-step .ls-v { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
.lev-step.accent .ls-v { color: var(--accent); }
.lev-arrow { flex: none; align-self: center; }

.prop-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.prop-icons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.prop-ic {
  width: 30px; height: 30px; border-radius: 9px; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; flex: none;
}
.prop-more { font-size: 12px; font-weight: 700; color: var(--accent); margin-left: 2px; }
.prop-note { font-size: 10px; font-weight: 600; color: var(--ink-2); font-family: var(--mono); text-align: right; flex: none; }

/* boule de neige */
.snow-chart { position: relative; margin-top: 14px; }
.snow-bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: end; height: 188px; }
.snow-bar { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 0; }
.snow-bar .sb-val { font-size: 12px; font-weight: 700; color: var(--ink); margin-bottom: 6px; letter-spacing: -0.01em; }
.snow-bar .sb-track { width: 100%; flex: 1; display: flex; align-items: flex-end; }
.snow-bar .sb-fill {
  width: 100%; border-radius: 8px 8px 3px 3px;
  background: linear-gradient(to top, #6E6EF2, #9B9BF7);
  transition: height .45s cubic-bezier(.22,.7,.3,1);
}
.snow-bar:first-child .sb-fill { background: linear-gradient(to top, #C7C7FA, #DCDCFC); }
.snow-bar:last-child .sb-fill { background: linear-gradient(to top, #4747D6, #6E6EF2); }
.snow-bar .sb-cap { margin-top: 8px; text-align: center; display: flex; flex-direction: column; gap: 1px; }
.snow-bar .sb-cap b { font-size: 11px; font-weight: 800; color: var(--ink); }
.snow-bar .sb-cap span { font-size: 9.5px; font-weight: 600; color: var(--ink-2); font-family: var(--mono); }
.snow-ref {
  position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px dashed var(--ink-2);
  opacity: .5; z-index: 2; pointer-events: none;
}
.snow-ref-tag {
  position: absolute; right: 0; top: -14px; font-size: 9px; font-weight: 700; color: var(--ink-2);
  background: var(--surface); padding: 0 4px;
}

.remploi-delta {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-radius: var(--r-sm); padding: 12px 14px; margin-top: 14px;
}
.remploi-delta.pos { background: var(--pos-bg); }
.remploi-delta.neg { background: var(--neg-bg); }
.remploi-delta .rd-label { font-size: 11px; font-weight: 700; line-height: 1.3; }
.remploi-delta.pos .rd-label { color: #0F7A50; }
.remploi-delta.neg .rd-label { color: #C0413A; }
.remploi-delta .rd-val { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; flex: none; }
.remploi-delta.pos .rd-val { color: var(--pos); }
.remploi-delta.neg .rd-val { color: var(--neg); }

/* ============================================================
   EXPORT PDF — impression A4 du dossier bancaire
   (window.print() → « Enregistrer au format PDF »)
   ============================================================ */
@media print {
  @page { size: A4; margin: 14mm; }
  html, body { background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .app-stage { display: block !important; min-height: 0 !important; padding: 0 !important; gap: 0 !important; }
  .hint, .notch, .home-ind, .statusbar, .appbar, .footer-cta, .dl-bar, .toast, .sheet-backdrop { display: none !important; }
  .phone { width: 100% !important; height: auto !important; background: #fff !important; border-radius: 0 !important; padding: 0 !important; box-shadow: none !important; }
  .screen { width: 100% !important; height: auto !important; border-radius: 0 !important; overflow: visible !important; background: #fff !important; }
  .app-root { height: auto !important; }
  .body { overflow: visible !important; height: auto !important; padding: 0 !important; }
  .report-pages, .dl-bar { display: none !important; }
  .rep-doc { position: static !important; left: auto !important; top: auto !important; width: 100% !important; }
  .rp-page { box-shadow: none !important; border: 1px solid #ECEDF4 !important; border-radius: 4px !important;
    break-inside: avoid; page-break-inside: avoid; margin-bottom: 8mm !important; padding: 6mm !important; }
}

/* ============================================================
   DOSSIER BANCAIRE — document A4 professionnel (export PDF)
   ============================================================ */
.rep-doc { position: fixed; left: -10000px; top: 0; width: 794px; background: #fff; color: var(--ink); font-family: var(--sans); }
.rep-page { width: 794px; min-height: 1122px; padding: 46px 52px 54px; position: relative; display: flex; flex-direction: column; background: #fff; box-sizing: border-box; }
.rep-page { break-after: page; page-break-after: always; }
.rep-page:last-child { break-after: auto; page-break-after: auto; }
.rep-top { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--ink); padding-bottom: 13px; margin-bottom: 20px; }
.rep-top .rt-brand { display: flex; align-items: center; gap: 12px; }
.rep-top .rt-logo { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); flex: none; }
.rep-top .rt-name { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
.rep-top .rt-tag { font-size: 10px; font-weight: 600; color: var(--ink-2); margin-top: 2px; }
.rep-top .rt-meta { text-align: right; font-size: 9.5px; color: var(--ink-2); font-weight: 600; line-height: 1.7; }
.rep-cover-title { font-size: 29px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.06; margin: 4px 0 6px; }
.rep-cover-sub { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.rep-h2 { font-size: 14px; font-weight: 800; letter-spacing: -0.01em; margin: 22px 0 11px; padding-bottom: 6px; border-bottom: 1px solid var(--track); display: flex; align-items: center; gap: 8px; }
.rep-h2 .num { width: 19px; height: 19px; border-radius: 6px; background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 800; display: inline-grid; place-items: center; flex: none; }
.rep-lead { font-size: 11px; color: var(--ink-2); line-height: 1.5; margin-bottom: 12px; }
.rep-id { display: grid; grid-template-columns: 1fr 1fr; gap: 0 30px; background: var(--bg-screen); border-radius: 10px; padding: 12px 20px; }
.rep-id .row { display: flex; justify-content: space-between; font-size: 11px; border-bottom: 1px dashed #DCDDE8; padding: 6px 0; }
.rep-id .row .k { color: var(--ink-2); font-weight: 600; }
.rep-id .row .v { font-weight: 700; }
.rep-verdict { display: flex; align-items: center; gap: 12px; border-radius: 10px; padding: 13px 18px; margin-bottom: 16px; }
.rep-verdict.pos { background: var(--pos-bg); } .rep-verdict.warn { background: var(--warn-bg); } .rep-verdict.neg { background: var(--neg-bg); }
.rep-verdict .vd { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.rep-verdict.pos .vd { background: var(--pos); } .rep-verdict.warn .vd { background: var(--warn); } .rep-verdict.neg .vd { background: var(--neg); }
.rep-verdict .vl { flex: 1; font-size: 14px; font-weight: 800; }
.rep-verdict.pos .vl { color: #0F7A50; } .rep-verdict.warn .vl { color: #A9760C; } .rep-verdict.neg .vl { color: #C0413A; }
.rep-verdict .vv { font-family: var(--mono); font-size: 18px; font-weight: 700; }
.rep-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }
.rep-kpi { border: 1px solid var(--track); border-radius: 10px; padding: 13px 15px; }
.rep-kpi .k { font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.rep-kpi .v { font-family: var(--mono); font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin-top: 6px; }
.rep-kpi .s { font-size: 8.5px; color: var(--ink-2); font-weight: 600; margin-top: 4px; }
.rep-kpi.pos .v { color: var(--pos); } .rep-kpi.neg .v { color: var(--neg); } .rep-kpi.warn .v { color: var(--warn); }
.rep-table { width: 100%; border-collapse: collapse; font-size: 10.5px; margin: 4px 0 12px; }

.rep-table td { padding: 6.5px 8px; border-bottom: 1px solid var(--track); }
.rep-table td.num, .rep-table th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }

.rep-pos { color: var(--pos); } .rep-neg { color: var(--neg); }
.rep-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }

.rep-foot { margin-top: auto; padding-top: 13px; border-top: 1px solid var(--track); display: flex; justify-content: space-between; font-size: 8px; color: #9C9DB0; }

</style>

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.3/dist/html2pdf.bundle.min.js"></script>

<script>
/* ============================================================
   MOTEUR DE CALCUL — bi-modal, fonction pure
   calc(inputs, mode, hypotheses) → results
   Aucune dépendance, testable, partagé web/mobile.
   ============================================================ */
(function () {
  "use strict";

  /* ---------- Formatage FR ---------- */
  const NBSP = "\u202F"; // espace fine insécable
  function groupThousands(s) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, NBSP); }
  function fmtEuro(v, dec) {
    if (v == null || isNaN(v)) return "—";
    const neg = v < 0; const a = Math.abs(v);
    const f = (dec ? a.toFixed(dec) : Math.round(a).toString());
    const parts = f.split(".");
    parts[0] = groupThousands(parts[0]);
    return (neg ? "−" : "") + parts.join(",") + NBSP + "€";
  }
  function fmtSignedEuro(v) { return (v >= 0 ? "+" : "") + fmtEuro(v); }
  function fmtK(v) {
    const neg = v < 0; const a = Math.abs(v);
    const k = a / 1000;
    const s = k >= 100 ? Math.round(k).toString() : k.toFixed(0);
    return (neg ? "−" : "") + groupThousands(s) + NBSP + "k€";
  }
  function fmtPct(v, dec) {
    if (v == null || isNaN(v)) return "—";
    return v.toFixed(dec == null ? 1 : dec).replace(".", ",") + NBSP + "%";
  }
  function fmtNum(v, dec) {
    if (v == null || isNaN(v)) return "—";
    return v.toFixed(dec == null ? 2 : dec).replace(".", ",");
  }

  /* ---------- Hypothèses par défaut (sourcées, datées) ---------- */
  const HYPOTHESES = {
    ps:            { val: 17.2, label: "Prélèvements sociaux", src: "BOFiP 2026", warn: true,
                     note: "Périmètre de la hausse CSG 2026 à confirmer (17,2 % vs 18,6 %)." },
    tmi:           { val: 30,   label: "Tranche marginale (IR)", src: "Barème IR 2026" },
    microFoncier:  { val: 30,   label: "Abattement micro-foncier", src: "CGI art. 32 — 2026" },
    microBIC:      { val: 50,   label: "Abattement micro-BIC meublé", src: "CGI art. 50-0 — 2026" },
    isReduit:      { val: 15,   label: "IS taux réduit (≤ 42 500 €)", src: "CGI art. 219 — 2026" },
    isNormal:      { val: 25,   label: "IS taux normal", src: "CGI art. 219 — 2026" },
    flatTax:       { val: 30,   label: "Flat tax distribution", src: "PFU — 2026" },
    droitsMdB:     { val: 0.715,label: "Droits MdB (engagement 5 ans)", src: "CGI art. 1115 — 2026", warn: true,
                     note: "Engagement de revendre dans 5 ans (2 ans par lots)." },
    hcsf:          { val: 35,   label: "Plafond endettement HCSF", src: "HCSF 2024" },
    margeCible:    { val: 20,   label: "Marge brute cible MdB", src: "Règle interne" },
    amortBati:     { val: 2.5,  label: "Amortissement bâti LMNP", src: "PCG / composants" }
  };

  /* ---------- Crédit : mensualité amortissement constant ---------- */
  function mensualite(capital, tauxAnnuelPct, dureeAnnees) {
    if (capital <= 0 || dureeAnnees <= 0) return 0;
    const n = dureeAnnees * 12;
    const t = tauxAnnuelPct / 100 / 12;
    if (t === 0) return capital / n;
    return capital * t / (1 - Math.pow(1 + t, -n));
  }
  // tableau d'amortissement → CRD année par année + intérêts an 1
  function amortissement(capital, tauxAnnuelPct, dureeAnnees) {
    const n = dureeAnnees * 12;
    const t = tauxAnnuelPct / 100 / 12;
    const m = mensualite(capital, tauxAnnuelPct, dureeAnnees);
    let crd = capital; const crdParAn = [capital]; let interets1 = 0;
    for (let i = 1; i <= n; i++) {
      const int = crd * t; const principal = m - int;
      crd = Math.max(0, crd - principal);
      if (i <= 12) interets1 += int;
      if (i % 12 === 0) crdParAn.push(crd);
    }
    return { mensualite: m, interets1, crdParAn };
  }

  /* ============================================================
     MODE B — LOCATIF
     ============================================================ */
  function regimeLocatif(regime, ctx, H) {
    // ctx : { loyerEncaisse, chargesDeductibles, interets1, assuranceAn, baseAmort, tmi, ps }
    const { loyerEncaisse, chargesDeductibles, interets1, assuranceAn, baseAmort } = ctx;
    const tmi = H.tmi.val / 100, ps = H.ps.val / 100;
    let imposable, impotIR = 0, psDus = 0, isDu = 0, label, detail;

    if (regime === "micro") {
      imposable = loyerEncaisse * (1 - H.microFoncier.val / 100);
      impotIR = imposable * tmi; psDus = imposable * ps;
      label = "Micro-foncier"; detail = "Abattement " + H.microFoncier.val + " %";
    } else if (regime === "reel") {
      imposable = Math.max(0, loyerEncaisse - chargesDeductibles - interets1 - assuranceAn);
      impotIR = imposable * tmi; psDus = imposable * ps;
      label = "Réel foncier"; detail = "Charges + intérêts déduits";
    } else if (regime === "lmnp") {
      const amort = baseAmort * (H.amortBati.val / 100) + (ctx.amortMobilier || 0);
      imposable = Math.max(0, loyerEncaisse - chargesDeductibles - interets1 - assuranceAn - amort);
      impotIR = imposable * tmi; psDus = imposable * ps;
      label = "LMNP réel"; detail = "Amortissement " + fmtEuro(amort);
    } else { // sci-is
      const amort = baseAmort * (H.amortBati.val / 100) + (ctx.amortMobilier || 0);
      const res = Math.max(0, loyerEncaisse - chargesDeductibles - interets1 - assuranceAn - amort);
      isDu = res <= 42500 ? res * (H.isReduit.val / 100)
                          : 42500 * (H.isReduit.val / 100) + (res - 42500) * (H.isNormal.val / 100);
      imposable = res;
      label = "SCI à l'IS"; detail = "IS 15 % / 25 %";
    }
    return { regime, label, detail, imposable, impot: impotIR + isDu, ps: psDus,
             total: impotIR + isDu + psDus };
  }

  function calcLocatif(I, H) {
    const coutTotal = I.prix + I.travaux + I.fraisNotaire + I.honoraires + I.fraisDossier + I.mobilier;
    const am = amortissement(I.emprunt, I.taux, I.dureeAnnees);
    const assuranceAn = I.emprunt * (I.assurance / 100);
    const assuranceMois = assuranceAn / 12;
    const serviceAnnuel = am.mensualite * 12 + assuranceAn;

    const loyerAnnuelHC = I.loyerHC * 12;
    const loyerEncaisse = loyerAnnuelHC * (1 - I.vacance / 100);
    const fraisGestion = loyerEncaisse * (I.gestion / 100);
    const chargesExploit = fraisGestion + I.assurancesPNO + I.taxeFonciere + I.chargesNonRecup + I.capex;
    const chargesDeductibles = fraisGestion + I.assurancesPNO + I.taxeFonciere + I.chargesNonRecup;

    const baseAmort = (I.prix + I.travaux) * 0.8; // base 80 % (terrain non amorti)
    const amortMobilier = I.mobilier > 0 ? I.mobilier / 7 : 0;
    const ctx = { loyerEncaisse, chargesDeductibles, interets1: am.interets1, assuranceAn, baseAmort, amortMobilier };

    const regimes = ["micro", "reel", "lmnp", "sci-is"].map(r => {
      const fisc = regimeLocatif(r, ctx, H);
      const cfNetNet = loyerEncaisse - serviceAnnuel - chargesExploit - fisc.total;
      return Object.assign({}, fisc, { cfNetNet, rdtNetNet: (loyerEncaisse - chargesExploit - fisc.total) / coutTotal * 100 });
    });
    const fisc = regimes.find(r => r.regime === I.regime) || regimes[2];

    const cfBrutAnnuel = loyerEncaisse - serviceAnnuel;
    const cfNetAnnuel = cfBrutAnnuel - chargesExploit;
    const cfNetNetAnnuel = cfNetAnnuel - fisc.total;

    const rdtBrut = loyerAnnuelHC / coutTotal * 100;
    const rdtNet = (loyerEncaisse - chargesExploit) / coutTotal * 100;
    const rdtNetNet = (loyerEncaisse - chargesExploit - fisc.total) / coutTotal * 100;

    const dscr = serviceAnnuel > 0 ? (loyerEncaisse - chargesExploit) / serviceAnnuel : 0;
    const ltv = I.prix > 0 ? I.emprunt / I.prix * 100 : 0;
    const chargeCreditMois = am.mensualite + assuranceMois;
    const revenusPondere = I.revenusMensuels + (loyerEncaisse / 12) * 0.7;
    const endettement = revenusPondere > 0 ? chargeCreditMois / revenusPondere * 100 : 0;
    const resteAVivre = I.revenusMensuels + loyerEncaisse / 12 - chargeCreditMois - I.chargesMenage;

    // mini-barres : cash-flow mensuel net-net lissé + saisonnalité légère
    const cfMois = cfNetNetAnnuel / 12;
    const barres = [0.42, 0.55, 0.48, 0.62, 0.58, 0.70, 0.64, 0.78, 0.72, 0.85, 0.80, 1.0];

    // projection 10 ans
    const valeur = [], crd = [];
    for (let y = 0; y <= 10; y++) {
      valeur.push(I.prix * Math.pow(1 + I.revaloBien / 100, y));
      crd.push(am.crdParAn[Math.min(y, am.crdParAn.length - 1)]);
    }

    const verdict = cfNetNetAnnuel >= 0
      ? { tone: "pos", label: "Opération autofinancée" }
      : (cfNetNetAnnuel > -1200 ? { tone: "warn", label: "Effort d'épargne modéré" }
                                : { tone: "neg", label: "Effort d'épargne important" });

    return {
      coutTotal, mensualite: am.mensualite, serviceAnnuel,
      cfBrutAnnuel, cfNetAnnuel, cfNetNetAnnuel, cfMois,
      rdtBrut, rdtNet, rdtNetNet, dscr, ltv, endettement, resteAVivre,
      barres, valeur, crd, regimes, fisc, verdict,
      seuils: {
        dscr: dscr >= 1.2 ? "pos" : (dscr >= 1.0 ? "warn" : "neg"),
        ltv: ltv <= 80 ? "pos" : (ltv <= 90 ? "warn" : "neg"),
        endettement: endettement <= 33 ? "pos" : (endettement <= 35 ? "warn" : "neg")
      }
    };
  }

  /* ============================================================
     MODE A — ACHAT-REVENTE
     ============================================================ */
  function calcRevente(I, H) {
    const droits = I.prix * (H.droitsMdB.val / 100);
    const am = amortissement(I.emprunt, I.taux, Math.max(I.dureeMois / 12, 0.01));
    // frais de portage = intérêts + assurance + TF prorata + charges, sur la détention
    const interetsPortage = I.emprunt * (I.taux / 100) * (I.dureeMois / 12) * 0.6; // ~ moyenne sur capital décroissant
    const assurancePortage = I.emprunt * (I.assurance / 100) * (I.dureeMois / 12);
    const tfProrata = I.taxeFonciere * (I.dureeMois / 12);
    const fraisPortage = interetsPortage + assurancePortage + tfProrata + I.chargesPortage;
    const fraisFinanciers = I.fraisDossier;

    const prixRevient = I.prix + droits + I.travaux + fraisPortage + fraisFinanciers + I.commercialisation;

    function scenario(prixRevente) {
      const margeBrute = prixRevente - prixRevient;
      const tauxMarge = prixRevient > 0 ? margeBrute / prixRevient * 100 : 0;
      const baseIS = Math.max(0, margeBrute);
      const is = baseIS <= 42500 ? baseIS * (H.isReduit.val / 100)
               : 42500 * (H.isReduit.val / 100) + (baseIS - 42500) * (H.isNormal.val / 100);
      const margeNette = margeBrute - is;
      const roi = I.apport > 0 ? margeNette / I.apport * 100 : 0;
      const tri = I.apport > 0 && margeNette > -I.apport
        ? (Math.pow(1 + margeNette / I.apport, 12 / Math.max(I.dureeMois, 1)) - 1) * 100 : 0;
      return { prixRevente, margeBrute, tauxMarge, is, margeNette, roi, tri };
    }

    const bas = scenario(I.reventeBas), med = scenario(I.reventeMed), haut = scenario(I.reventeHaut);
    const prixM2Revente = I.surface > 0 ? med.prixRevente / I.surface : 0;
    const pointMortNul = prixRevient;
    const pointMort20 = prixRevient * (1 + H.margeCible.val / 100);

    const verdict = med.tauxMarge >= H.margeCible.val
      ? { tone: "pos", label: "Marge cible atteinte" }
      : (med.tauxMarge >= 12 ? { tone: "warn", label: "Marge sous l'objectif" }
                             : { tone: "neg", label: "Marge insuffisante" });

    return {
      prixRevient, droits, fraisPortage, fraisFinanciers,
      bas, med, haut, prixM2Revente, pointMortNul, pointMort20,
      mensualite: am.mensualite, verdict,
      seuils: { marge: med.tauxMarge >= 20 ? "pos" : (med.tauxMarge >= 12 ? "warn" : "neg") }
    };
  }

  /* ============================================================
     STRESS TESTS
     ============================================================ */
  function stressLocatif(I, H) {
    const base = calcLocatif(I, H);
    const tests = [
      { label: "Taux +1 pt", I: Object.assign({}, I, { taux: I.taux + 1 }) },
      { label: "Vacance +5 pts", I: Object.assign({}, I, { vacance: I.vacance + 5 }) },
      { label: "Loyer −1 mois", I: Object.assign({}, I, { loyerHC: I.loyerHC * 11 / 12 }) }
    ];
    return { base, rows: tests.map(t => {
      const r = calcLocatif(t.I, H);
      return { label: t.label, cf: r.cfNetNetAnnuel, dscr: r.dscr,
               delta: r.cfNetNetAnnuel - base.cfNetNetAnnuel, seuil: r.seuils.dscr };
    }) };
  }
  function stressRevente(I, H) {
    const base = calcRevente(I, H);
    const tests = [
      { label: "Revente −10 %", I: Object.assign({}, I, {
          reventeBas: I.reventeBas * .9, reventeMed: I.reventeMed * .9, reventeHaut: I.reventeHaut * .9 }) },
      { label: "Travaux +15 %", I: Object.assign({}, I, { travaux: I.travaux * 1.15 }) },
      { label: "Portage +6 mois", I: Object.assign({}, I, { dureeMois: I.dureeMois + 6 }) }
    ];
    return { base, rows: tests.map(t => {
      const r = calcRevente(t.I, H);
      return { label: t.label, marge: r.med.margeNette, taux: r.med.tauxMarge,
               delta: r.med.margeNette - base.med.margeNette, seuil: r.seuils.marge };
    }) };
  }

  /* ============================================================
     STRUCTURES JURIDIQUES — comparaison par forme de détention
     ============================================================ */
  function legalStructuresLocatif(I, H) {
    const coutTotal = I.prix + I.travaux + I.fraisNotaire + I.honoraires + I.fraisDossier + I.mobilier;
    const am = amortissement(I.emprunt, I.taux, I.dureeAnnees);
    const assuranceAn = I.emprunt * (I.assurance / 100);
    const serviceAnnuel = am.mensualite * 12 + assuranceAn;
    const loyerEncaisse = I.loyerHC * 12 * (1 - I.vacance / 100);
    const fraisGestion = loyerEncaisse * (I.gestion / 100);
    const chargesDeductibles = fraisGestion + I.assurancesPNO + I.taxeFonciere + I.chargesNonRecup;
    const chargesExploit = chargesDeductibles + I.capex;
    const baseAmortBati = (I.prix + I.travaux) * 0.8;
    const amortBatiAn = baseAmortBati * (H.amortBati.val / 100);
    const amortMobilierAn = I.mobilier > 0 ? I.mobilier / 7 : 0;
    const tmi = H.tmi.val / 100, ps = H.ps.val / 100;
    const valeur10 = I.prix * Math.pow(1 + I.revaloBien / 100, 10);
    const appreciation = Math.max(0, valeur10 - (I.prix + I.travaux));
    const baseEco = Math.max(1, loyerEncaisse - chargesExploit - am.interets1 - assuranceAn);

    function pack(id, name, family, note, o) {
      const resultatNet = loyerEncaisse - serviceAnnuel - chargesExploit - o.impot;
      return {
        id, name, family, note, regime: o.regime,
        resultatNet, impot: o.impot, tauxEffectif: o.impot / baseEco * 100,
        tresoDistrib: o.tresoDistrib != null ? o.tresoDistrib : resultatNet,
        effetRevente: o.effetRevente, effetLabel: o.effetLabel
      };
    }

    // Nom propre — foncier nu : meilleur de micro / réel
    const impMicro = loyerEncaisse * (1 - H.microFoncier.val / 100);
    const impReel = Math.max(0, loyerEncaisse - chargesDeductibles - am.interets1 - assuranceAn);
    const useReel = impReel <= impMicro;
    const foncier = pack("foncier", "Nom propre — foncier nu", "ir",
      (useReel ? "Régime réel" : "Micro-foncier (abatt. 30 %)") + " · IR + PS",
      { impot: (useReel ? impReel : impMicro) * (tmi + ps), regime: "reel",
        effetRevente: 0, effetLabel: "Aucun amortissement à réintégrer" });

    // Nom propre — LMNP réel
    const lmnpImp = Math.max(0, loyerEncaisse - chargesDeductibles - am.interets1 - assuranceAn - amortBatiAn - amortMobilierAn);
    const amortCumul10 = Math.min(amortBatiAn * 10 + amortMobilierAn * 7, baseAmortBati + I.mobilier);
    const lmnp = pack("lmnp", "Nom propre — LMNP réel", "ir",
      "Amortissement " + fmtEuro(amortBatiAn + amortMobilierAn) + "/an · IR + PS",
      { impot: lmnpImp * (tmi + ps), regime: "lmnp",
        effetRevente: -(amortCumul10 * 0.30), effetLabel: "Réintégration des amortissements (PV)" });

    // SCI à l'IR — transparente (réel foncier au niveau des associés)
    const sciIr = pack("sci-ir", "SCI à l'IR", "ir",
      "Transparente · réel foncier chez les associés",
      { impot: impReel * (tmi + ps), regime: "reel",
        effetRevente: 0, effetLabel: "Plus-value des particuliers" });

    // SCI à l'IS
    const sciIsRes = Math.max(0, loyerEncaisse - chargesDeductibles - am.interets1 - assuranceAn - amortBatiAn - amortMobilierAn);
    const sciIsImp = sciIsRes <= 42500 ? sciIsRes * (H.isReduit.val / 100)
                   : 42500 * (H.isReduit.val / 100) + (sciIsRes - 42500) * (H.isNormal.val / 100);
    const cfSoc = loyerEncaisse - serviceAnnuel - chargesExploit - sciIsImp;
    const distribuable = Math.max(0, sciIsRes - sciIsImp);
    const pvProBase = appreciation + amortBatiAn * 10;
    const sciIs = pack("sci-is", "SCI à l'IS", "is",
      "IS " + H.isReduit.val + " % / " + H.isNormal.val + " % · distribution flat tax",
      { impot: sciIsImp, regime: "sci-is",
        tresoDistrib: cfSoc - distribuable * (H.flatTax.val / 100),
        effetRevente: -(pvProBase * 0.25), effetLabel: "PV pro · IS sur " + fmtK(pvProBase) });

    const list = [foncier, lmnp, sciIr, sciIs];
    return { mode: "b", list, coutTotal, valeur10,
      headlineKey: "resultatNet", headlineLabel: "Cash-flow net-net / an" };
  }

  function legalStructuresRevente(I, H) {
    const r = calcRevente(I, H);
    const marge = r.med.margeBrute;
    function isImpot(base) {
      return base <= 42500 ? base * (H.isReduit.val / 100)
        : 42500 * (H.isReduit.val / 100) + (base - 42500) * (H.isNormal.val / 100);
    }
    function pack(id, name, family, note, o) {
      const impotSoc = o.impotSoc, flat = o.flat || 0;
      const margeNette = marge - impotSoc;        // après IS (ou social+IR), avant distribution
      const treso = margeNette - flat;            // en poche après flat tax
      const tri = I.apport > 0 && treso > -I.apport
        ? (Math.pow(1 + treso / I.apport, 12 / Math.max(I.dureeMois, 1)) - 1) * 100 : 0;
      return {
        id, name, family, note,
        resultatNet: margeNette, impot: impotSoc + flat,
        tauxEffectif: marge > 0 ? (impotSoc + flat) / marge * 100 : 0,
        tresoDistrib: treso, effetRevente: tri, effetLabel: "TRI annualisé sur apport"
      };
    }
    const baseIS = Math.max(0, marge);
    const is = isImpot(baseIS);
    const flat = Math.max(0, baseIS - is) * (H.flatTax.val / 100);

    const social = baseIS * 0.35;
    const ir = Math.max(0, baseIS - social) * (H.tmi.val / 100);
    const bic = pack("bic-ir", "Nom propre — BIC", "ir",
      "BIC pro · cotisations sociales + IR", { impotSoc: social + ir });
    const sciIs = pack("sci-is", "SCI à l'IS", "is",
      "Objet civil · adapté si revente non habituelle", { impotSoc: is, flat: flat });
    const sasIs = pack("sas-is", "SAS / SASU à l'IS", "is",
      "IS + flat tax · président assimilé salarié", { impotSoc: is, flat: flat });

    return { mode: "a", list: [bic, sciIs, sasIs], marge, prixRevient: r.prixRevient,
      headlineKey: "tresoDistrib", headlineLabel: "Trésorerie nette en poche" };
  }

  function legalStructures(inputs, mode, H) {
    H = H || HYPOTHESES;
    const d = mode === "a" ? legalStructuresRevente(inputs, H) : legalStructuresLocatif(inputs, H);
    const key = d.headlineKey;
    d.list.sort((a, b) => b[key] - a[key]);
    d.bestId = d.list[0].id;
    d.max = Math.max(...d.list.map(s => Math.abs(s[key])), 1);
    return d;
  }

  /* ============================================================
     HORIZON DE REVENTE — fiscalité de la plus-value par durée
     Abattements particuliers : exonération IR à 22 ans, PS à 30 ans.
     LMNP : réintégration des amortissements (LF 2025).
     SCI à l'IS : plus-value professionnelle (valeur − VNC), IS + flat tax.
     ============================================================ */
  function abatIR(Y) { if (Y <= 5) return 0; if (Y < 22) return (Y - 5) * 6; return 100; }
  function abatPS(Y) {
    if (Y <= 5) return 0;
    if (Y <= 21) return (Y - 5) * 1.65;
    if (Y < 30) return 28 + (Y - 22) * 9;   // 22e année ≈ 28 %, puis +9 %/an
    return 100;
  }

  function resaleTimingLocatif(I, H) {
    const am = amortissement(I.emprunt, I.taux, I.dureeAnnees);
    const prixAcq = I.prix + I.travaux + I.fraisNotaire;
    const baseAmortBati = (I.prix + I.travaux) * 0.8;
    const amortBatiAn = baseAmortBati * (H.amortBati.val / 100);
    const amortMobAn = I.mobilier > 0 ? I.mobilier / 7 : 0;
    const g = I.revaloBien / 100;
    const apport = I.apport > 0 ? I.apport : Math.max(1, I.prix - I.emprunt);
    const ps = H.ps.val / 100, ivPart = 0.19; // IR plus-value des particuliers : 19 %
    const ls = legalStructuresLocatif(I, H).list;
    const YEARS = 25;

    function pvParticulier(valeur, Y, amortReint) {
      const brut = Math.max(0, valeur - prixAcq);
      let imp = brut * (1 - abatIR(Y) / 100) * ivPart + brut * (1 - abatPS(Y) / 100) * ps;
      if (amortReint) imp += amortReint * 0.30; // amortissements réintégrés, sans abattement
      return Math.max(0, imp);
    }
    function pvIS(valeur, Y, amortCumuleBati) {
      const vnc = Math.max(0, (I.prix + I.travaux) - amortCumuleBati);
      const pv = Math.max(0, valeur - vnc);
      const is = pv <= 42500 ? pv * (H.isReduit.val / 100)
        : 42500 * (H.isReduit.val / 100) + (pv - 42500) * (H.isNormal.val / 100);
      const flat = Math.max(0, pv - is) * (H.flatTax.val / 100);
      return is + flat;
    }

    const structures = ls.map(s => {
      const series = []; let optimalYear = 1, optimalTri = -Infinity, optimalWealth = 0;
      for (let Y = 1; Y <= YEARS; Y++) {
        const valeur = I.prix * Math.pow(1 + g, Y);
        const crd = am.crdParAn[Math.min(Y, am.crdParAn.length - 1)];
        const cumulCF = s.resultatNet * Y;
        const amortBatiCum = Math.min(amortBatiAn * Y, baseAmortBati);
        const amortMobCum = Math.min(amortMobAn * Y, I.mobilier);
        let impotPV;
        if (s.id === "sci-is") impotPV = pvIS(valeur, Y, amortBatiCum);
        else if (s.id === "lmnp") impotPV = pvParticulier(valeur, Y, amortBatiCum + amortMobCum);
        else impotPV = pvParticulier(valeur, Y, 0);
        const equity = valeur - crd - impotPV;
        const wealth = cumulCF + equity;
        const gainNet = wealth - apport;
        const mult = wealth / apport;
        const tri = mult > 0 ? (Math.pow(mult, 1 / Y) - 1) * 100 : -50;
        series.push({ year: Y, valeur, crd, cumulCF, impotPV, equity, wealth, gainNet, tri });
        if (tri > optimalTri) { optimalTri = tri; optimalYear = Y; optimalWealth = wealth; }
      }
      const milestones = [];
      if (s.id === "foncier" || s.id === "sci-ir") {
        milestones.push({ year: 22, label: "Exon. IR" });
        milestones.push({ year: 30, label: "Exon. PS" });
      } else if (s.id === "lmnp") {
        milestones.push({ year: 22, label: "Exon. IR" });
      }
      const note = s.id === "sci-is"
        ? "À l'IS, l'impôt de plus-value augmente avec la détention : les amortissements réduisent la VNC, donc la base imposable (valeur − VNC) gonfle."
        : s.id === "lmnp"
        ? "Cash-flow optimisé par l'amortissement, mais celui-ci est réintégré dans la plus-value à la revente (LF 2025)."
        : "Plus-value des particuliers : abattements pour durée de détention, exonération IR à 22 ans et PS à 30 ans.";
      return { id: s.id, name: s.name, family: s.family, regime: s.regime, series, optimalYear, optimalTri, optimalWealth, milestones, note };
    });
    const maxWealth = Math.max(...structures.flatMap(r => r.series.map(p => p.wealth)), 1);
    const maxImpot = Math.max(...structures.flatMap(r => r.series.map(p => p.impotPV)), 1);
    return { mode: "b", structures, maxWealth, maxImpot, years: YEARS, apport };
  }

  function resaleTimingRevente(I, H) {
    const months = [6, 9, 12, 15, 18, 24, 30, 36];
    const series = months.map(m => {
      const r = calcRevente(Object.assign({}, I, { dureeMois: m }), H);
      return { months: m, year: m / 12, margeNette: r.med.margeNette, tri: r.med.tri, tauxMarge: r.med.tauxMarge };
    });
    let opt = series[0]; series.forEach(s => { if (s.tri > opt.tri) opt = s; });
    const maxMarge = Math.max(...series.map(s => Math.abs(s.margeNette)), 1);
    return { mode: "a", series, optimalMonths: opt.months, optimalTri: opt.tri, optimalMarge: opt.margeNette, maxMarge };
  }

  function resaleTiming(inputs, mode, H) {
    H = H || HYPOTHESES;
    return mode === "a" ? resaleTimingRevente(inputs, H) : resaleTimingLocatif(inputs, H);
  }

  /* ============================================================
     STRATÉGIE DE REMPLOI — revendre puis racheter (effet boule de neige)
     ============================================================ */
  function reinvestStrategy(I, H, structureId, resaleYear, nbBiens) {
    H = H || HYPOTHESES;
    const t = resaleTimingLocatif(I, H);
    const s = t.structures.find(x => x.id === structureId) || t.structures[0];
    const ry = resaleYear || s.optimalYear;
    const pt = s.series.find(p => p.year === ry) || s.series[s.series.length - 1];

    const coutTotal = I.prix + I.travaux + I.fraisNotaire + I.honoraires + I.fraisDossier + I.mobilier;
    const apportRate = I.apport > 0 ? I.apport / coutTotal : 0.27;
    const capitalNet = Math.max(0, pt.equity + pt.cumulCF);  // net de revente + cash-flow accumulé
    const capaciteValeur = capitalNet / apportRate;          // valeur achetable avec le même levier
    const nbMax = Math.max(1, Math.round(capaciteValeur / coutTotal));
    const biens = nbBiens || nbMax;
    const multiple = capitalNet / Math.max(1, I.apport);

    // boule de neige : 2 cycles de réinvestissement (3 jalons)
    const NB = 2;
    const cycles = [];
    for (let c = 0; c <= NB; c++) {
      const patrimoine = I.apport * Math.pow(multiple, c);
      cycles.push({ cycle: c, annee: c * ry, patrimoine,
        parcValeur: patrimoine / apportRate, biens: Math.max(1, Math.round(patrimoine / apportRate / coutTotal)) });
    }
    // référence "sans remploi" : conserver un seul bien sur la même durée
    const horizon = Math.min(NB * ry, 25);
    const conserver = (s.series.find(p => p.year === horizon) || s.series[s.series.length - 1]).wealth;

    // comparaison du timing fiscal : capital dégagé selon l'année de revente
    const yearsOpt = Array.from(new Set([10, s.optimalYear, 22].filter(y => y >= 1 && y <= 25))).sort((a, b) => a - b);
    const scenarios = yearsOpt.map(y => {
      const p = s.series.find(x => x.year === y);
      return { year: y, capital: Math.max(0, p.equity + p.cumulCF), impotPV: p.impotPV, isOptimal: y === s.optimalYear };
    });

    return {
      structureId: s.id, name: s.name, family: s.family, optimalYear: s.optimalYear,
      ry, capitalNet, impotPV: pt.impotPV, coutTotal, apportRate, apport: I.apport,
      capaciteValeur, nbMax, biens, multiple, cycles, conserver, horizon, scenarios, note: s.note
    };
  }

  /* ---------- Entrée unique ---------- */
  function calc(inputs, mode, H) {
    H = H || HYPOTHESES;
    return mode === "a" ? calcRevente(inputs, H) : calcLocatif(inputs, H);
  }

  /* ---------- Valeurs par défaut (jeu d'exemple cohérent) ---------- */
  const DEFAULTS = {
    bien: {
      type: "Appartement T3", surface: 58, ville: "Lyon 7e", cp: "69007",
      etat: "Ancien rénové", dpe: "C", lots: 1, initiales: "AT", nom: "Appartement T3"
    },
    common: {
      prix: 280000, travaux: 12000, fraisNotaire: 21000, honoraires: 0, fraisDossier: 1500,
      emprunt: 230000, apport: 84500, taux: 3.5, dureeAnnees: 25, assurance: 0.13
    },
    locatif: {
      loyerHC: 1760, indexationIRL: 2.0, revaloBien: 1.5, vacance: 5, gestion: 6,
      assurancesPNO: 360, taxeFonciere: 1100, chargesNonRecup: 480, capex: 700,
      mobilier: 8000, regime: "lmnp", revenusMensuels: 2400, chargesMenage: 760,
      typeLocation: "Meublée"
    },
    revente: {
      surface: 58, dureeMois: 12, reventeBas: 330000, reventeMed: 352000, reventeHaut: 372000,
      taxeFonciere: 1100, chargesPortage: 2400, commercialisation: 9000
    }
  };
  // inputs combinés pour chaque mode
  function buildInputs(state, mode) {
    const b = state.bien, c = state.common;
    if (mode === "a") {
      const r = state.revente;
      return Object.assign({ surface: b.surface }, c, r);
    }
    const l = state.locatif;
    return Object.assign({ surface: b.surface }, c, l);
  }

  window.Engine = {
    HYPOTHESES, DEFAULTS, calc, calcLocatif, calcRevente,
    stressLocatif, stressRevente, mensualite, amortissement, buildInputs,
    legalStructures, legalStructuresLocatif, legalStructuresRevente,
    resaleTiming, resaleTimingLocatif, resaleTimingRevente,
    reinvestStrategy,
    fmt: { euro: fmtEuro, signedEuro: fmtSignedEuro, k: fmtK, pct: fmtPct, num: fmtNum, NBSP }
  };
})();
</script>

<script type="text/babel">
/* ============================================================
   UI — primitives & charts partagés
   ============================================================ */
const { useState, useEffect, useRef, useMemo } = React;
const F = window.Engine.fmt;

/* ---------- Status bar / phone chrome ---------- */
function StatusBar() {

        <svg width="17" height="12" viewBox="0 0 17 12" fill="#191A2C"><path d="M8.5 2.2c2.3 0 4.4.9 6 2.4l1.3-1.4C13.9 1.3 11.3.2 8.5.2S3.1 1.3 1.2 3.2L2.5 4.6C4.1 3.1 6.2 2.2 8.5 2.2z"/><circle cx="8.5" cy="9.8" r="1.8"/></svg>

function AppBar({ kicker, title, step, onBack }) {

    <div className="appbar">

function Steps({ total, current }) {

}

      </div>
      {note && <div className={"field-note" + (noteWarn ? " warn" : "")}>{note}</div>}

}

function TextField({ label, value, onChange }) {

    <div className="field">
      <label>{label}</label>

}

function SliderField({ label, value, onChange, min, max, step, fmt }) {

        onChange={e => onChange(parseFloat(e.target.value))} />

  );
}

function GroupLabel({ children }) { return <div className="group-label">{children}</div>; }

/* ---------- Charts ---------- */
function Donut({ value, max, label, center, sub }) {
  const r = 44, c = 2 * Math.PI * r;
  const frac = Math.max(0, Math.min(1, value / max));
  const offset = c * (1 - frac);
  return (
    <div className="donut-wrap">
      <svg width="104" height="104" viewBox="0 0 104 104">
        <circle cx="52" cy="52" r={r} fill="none" stroke="var(--track)" strokeWidth="11"/>
        <circle cx="52" cy="52" r={r} fill="none" stroke="var(--accent)" strokeWidth="11"
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={offset}
          transform="rotate(-90 52 52)" style={{ transition: "stroke-dashoffset .5s ease" }}/>
      </svg>
      <div className="donut-center">
        <span className="dc-val mono">{center}</span>
        <span className="dc-cap">{sub}</span>
      </div>
    </div>
  );
}

function MiniBars({ bars, tone }) {
  return (
    <div className="minibars">
      {bars.map((h, i) => (
        <span key={i} style={{ height: (h * 100) + "%", background: i === bars.length - 1 ? `var(--${tone})` : (h > 0.6 ? `var(--${tone})` : "var(--track)") }} />
      ))}
    </div>
  );
}

function Projection({ valeur, crd }) {
  // normalize to viewbox 320x140 (y plot 28..118)
  const W = 320, H = 140, x0 = 8, x1 = 312, yTop = 26, yBot = 118;
  const allMax = Math.max(...valeur, ...crd, 1);
  const n = valeur.length;
  const px = i => x0 + (x1 - x0) * (i / (n - 1));
  const py = v => yBot - (yBot - yTop) * (v / allMax);
  const valPts = valeur.map((v, i) => `${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
  const crdPts = crd.map((v, i) => `${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
  const area = `${px(0)},${py(valeur[0])} ` + valeur.map((v, i) => `${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(" ") + ` ${x1},${yBot} ${x0},${yBot}`;
  return (
    <svg width="100%" viewBox="0 0 320 140" style={{ display: "block", marginTop: 12 }} preserveAspectRatio="none">
      {[40, 79, 118].map(y => <line key={y} x1="8" y1={y} x2="312" y2={y} stroke="var(--track)" strokeWidth="1"/>)}
      <polygon points={area} fill="var(--accent)" fillOpacity="0.10"/>
      <polyline points={valPts} fill="none" stroke="var(--accent)" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/>
      <polyline points={crdPts} fill="none" stroke="var(--teal)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="2 5"/>
    </svg>
  );
}

/* ---------- KPI card ---------- */
function Kpi({ label, value, foot, tone, small }) {
  return (
    <div className={"card" + (tone ? " kpi-" + tone : "")} style={small ? { padding: "13px 12px" } : null}>
      <div className="kpi-label" dangerouslySetInnerHTML={{ __html: label }} />
      <div className="kpi-value mono">{value}</div>
      {foot && <div className="kpi-foot">{foot}</div>}
    </div>
  );
}

/* ---------- Disclaimer ---------- */
function Disclaimer() {
  return <div className="disclaimer">Simulation d'aide à la décision, ne constitue pas un conseil fiscal / juridique / en investissement.</div>;
}

/* ---------- Hypothesis chip + edit sheet ---------- */
function HypoChip({ h, onEdit }) {
  return (
    <div className={"hypo-chip" + (h.warn ? " warn" : "")} onClick={onEdit}>
      <span className="hc-val">{h.label.includes("sociaux") ? "PS" : h.label} {F.num(h.val, h.val % 1 === 0 ? 0 : 1)} % · {h.src}</span>
      <span className="hc-edit">modifier</span>
    </div>
  );
}

function HypoSheet({ hkey, H, onChange, onClose }) {
  const h = H[hkey];
  const [v, setV] = useState(h.val);
  return (
    <div className="sheet-backdrop" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div className="sheet-grab" />
        <h3>{h.label}</h3>
        <p className="sub">Valeur par défaut sourcée et datée. Vous pouvez l'ajuster ; la modification recalcule tous les résultats.</p>
        <div className="src-pill">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><circle cx="5.5" cy="5.5" r="4.6" stroke="currentColor" strokeWidth="1"/><path d="M5.5 3.2v3M5.5 7.6v.3" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>
          Source · {h.src}
        </div>
        <SliderField label="Valeur retenue" value={v} onChange={setV} min={0} max={h.val * 2.2 || 40} step={0.1} fmt={x => F.num(x, 1) + " %"} />
        {h.warn && <div className="field-note warn" style={{ marginBottom: 14 }}>⚠ {h.note} Recommandation : faire valider par un expert-comptable / avocat fiscaliste.</div>}
        <button className="btn btn-primary" onClick={() => { onChange(hkey, v); onClose(); }}>Appliquer</button>
        <button className="btn btn-secondary" style={{ marginTop: 8 }} onClick={() => { onChange(hkey, h.val); onClose(); }}>Réinitialiser à {F.num(h.val, h.val % 1 === 0 ? 0 : 1)} %</button>
      </div>
    </div>
  );
}

Object.assign(window, {
  StatusBar, AppBar, Steps, NumField, TextField, ChoiceField, SliderField, GroupLabel,
  Donut, MiniBars, Projection, Kpi, Disclaimer, HypoChip, HypoSheet
});
</script>

            <div key={s.id} className={"card struct-card" + (isOpen ? " open" : "") + (isSel ? " sel" : (isBest ? " best" : ""))}

                  <div className="struct-name">{s.name}{isBest && <span className="opt-tag">Optimal</span>}{isSel && !isBest && <span className="opt-tag" style={{ color: "var(--accent)", background: "var(--accent-soft)" }}>Retenu</span>}</div>
