/* ============================================================
   DOSSIER BANCAIRE — document A4 professionnel (source de l'export PDF)
   ============================================================ */
function bankData(state, mode, H) {
  const E = window.Engine, I = E.buildInputs(state, mode);
  const assuranceAn = I.emprunt * (I.assurance / 100);
  if (mode === "a") {
    const r = E.calcRevente(I, H);
    const am = E.amortissement(I.emprunt, I.taux, Math.max(I.dureeMois / 12, 0.01));
    const stress = E.stressRevente(I, H);
    return { mode, I, r, am, assuranceAn, stress };
  }
  const r = E.calcLocatif(I, H);
  const am = E.amortissement(I.emprunt, I.taux, I.dureeAnnees);
  const stress = E.stressLocatif(I, H);
  const loyerHCan = I.loyerHC * 12;
  const loyerEnc = loyerHCan * (1 - I.vacance / 100);
  const fraisGestion = loyerEnc * (I.gestion / 100);
  const chargesExploit = fraisGestion + I.assurancesPNO + I.taxeFonciere + I.chargesNonRecup + I.capex;
  const chargesDeduct = chargesExploit - I.capex;
  const serviceAn = am.mensualite * 12 + assuranceAn;
  const coutCredit = am.mensualite * 12 * I.dureeAnnees - I.emprunt;
  const baseAmortBati = (I.prix + I.travaux) * 0.8;
  const amortBatiAn = baseAmortBati * (H.amortBati.val / 100);
  const amortMobAn = I.mobilier > 0 ? I.mobilier / 7 : 0;
  const tmi = H.tmi.val / 100, ps = H.ps.val / 100, reg = state.locatif.regime || "lmnp";
  const IRL = I.indexationIRL / 100, infl = 0.015;
  const IS = x => x <= 42500 ? x * (H.isReduit.val / 100) : 42500 * (H.isReduit.val / 100) + (x - 42500) * (H.isNormal.val / 100);
  const proj = []; let cumCF = 0;
  for (let y = 1; y <= 10; y++) {
    const loy = loyerHCan * Math.pow(1 + IRL, y - 1) * (1 - I.vacance / 100);
    const ch = chargesExploit * Math.pow(1 + infl, y - 1);
    const chDed = chargesDeduct * Math.pow(1 + infl, y - 1);
    const principal = am.crdParAn[y - 1] - am.crdParAn[y];
    const interest = Math.max(0, am.mensualite * 12 - principal);
    const amort = (reg === "lmnp" || reg === "sci-is") ? amortBatiAn + (y <= 7 ? amortMobAn : 0) : 0;
    const taxable = reg === "micro"
      ? Math.max(0, loy * (1 - H.microFoncier.val / 100))
      : Math.max(0, loy - chDed - interest - assuranceAn - amort);
    const impot = reg === "sci-is" ? IS(taxable) : taxable * (tmi + ps);
    const cf = loy - serviceAn - ch - impot;
    cumCF += cf;
    proj.push({ y, loy, ch, impot, cf, cumCF, crd: am.crdParAn[y], valeur: I.prix * Math.pow(1 + I.revaloBien / 100, y) });
  }
  return { mode, I, r, am, assuranceAn, stress, loyerHCan, loyerEnc, fraisGestion, chargesExploit, chargesDeduct, serviceAn, coutCredit, proj, reg };
}

<script type="text/babel">
/* ============================================================
   ÉCRAN — Horizon de revente (quand revendre pour optimiser la fiscalité)
   ============================================================ */

/* Courbe richesse nette + impôt PV sur 25 ans, avec marqueur optimal + jalons */
function TimingChartB({ serie, maxWealth, maxImpot, optimalYear, milestones }) {
  const W = 320, x0 = 10, x1 = 310, yTop = 16, yBot = 104;
  const n = serie.length;
  const px = y => x0 + (x1 - x0) * ((y - 1) / (n - 1));
  const pyW = v => yBot - (yBot - yTop) * (Math.max(0, v) / maxWealth);
  const pyI = v => yBot - (yBot - yTop) * (v / maxImpot);
  const wPts = serie.map(p => `${px(p.year).toFixed(1)},${pyW(p.wealth).toFixed(1)}`).join(" ");
  const iPts = serie.map(p => `${px(p.year).toFixed(1)},${pyI(p.impotPV).toFixed(1)}`).join(" ");
  const area = `${px(1)},${yBot} ` + wPts + ` ${px(n)},${yBot}`;
  const optX = px(optimalYear);
  const optPt = serie.find(p => p.year === optimalYear);
  return (
    <svg width="100%" viewBox="0 0 320 124" style={{ display: "block" }} preserveAspectRatio="none">
      {[yTop, (yTop + yBot) / 2, yBot].map((y, i) => <line key={i} x1={x0} y1={y} x2={x1} y2={y} stroke="var(--track)" strokeWidth="1" />)}
      {milestones.map((m, i) => (
        <g key={i}>
          <line x1={px(m.year)} y1={yTop} x2={px(m.year)} y2={yBot} stroke="#D9DAE8" strokeWidth="1" strokeDasharray="2 3" />
          <text x={px(m.year)} y={yTop - 5} fill="#A2A3B6" fontSize="7.5" fontWeight="700" textAnchor="middle" fontFamily="var(--mono)">{m.year} ans</text>
        </g>
      ))}
      <polygon points={area} fill="var(--accent)" fillOpacity="0.10" />
      <polyline points={wPts} fill="none" stroke="var(--accent)" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" />
      <polyline points={iPts} fill="none" stroke="var(--neg)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="3 4" />
      <line x1={optX} y1={yTop} x2={optX} y2={yBot} stroke="var(--accent)" strokeWidth="1.5" />
      {optPt && <circle cx={optX} cy={pyW(optPt.wealth)} r="4.5" fill="var(--accent)" stroke="#fff" strokeWidth="2" />}
    </svg>
  );
}

function ResaleTimingScreen({ state, mode, H, back, go, openHypo }) {
  const isA = mode === "a";
  const d = useMemo(() => window.Engine.resaleTiming(window.Engine.buildInputs(state, mode), mode, H), [state, H, mode]);

  if (isA) return <ResaleTimingA d={d} back={back} openHypo={openHypo} H={H} />;

  const [sid, setSid] = useState(() => state.locatif.structure || d.structures[0].id);
  const sel = d.structures.find(s => s.id === sid) || d.structures[0];
  const optPt = sel.series.find(p => p.year === sel.optimalYear);

  // horizons clés à afficher dans la table
  const baseYears = [5, 10, 15, 20];
  const extra = sel.milestones.map(m => m.year);
  const years = Array.from(new Set([...baseYears, ...extra, sel.optimalYear, 25])).filter(y => y <= 25).sort((a, b) => a - b);

  return (
    <div className="app-root">
      <StatusBar />
      <AppBar kicker="Mode B · Locatif" title="Horizon de revente" onBack={back} />
      <div className="body page" style={{ paddingTop: 4 }}>
        <p className="screen-intro">À quel moment revendre pour optimiser la fiscalité ? Choisissez une structure : le moteur compare l'impôt de plus-value et le TRI net pour chaque durée de détention.</p>

        <div className="chip-scroll">

<script type="text/babel">
/* ============================================================
   ÉCRAN — Stratégie de remploi
   Revendre au bon moment dégage un capital net ; réinvesti avec
   le même effet de levier, il finance le rachat de plusieurs biens
   (effet « boule de neige »). Accessible depuis l'Horizon de revente.
   ============================================================ */

/* Mini histogramme de l'effet boule de neige (patrimoine par cycle) */
function SnowballChart({ cycles, conserver }) {
  const maxV = Math.max(...cycles.map(c => c.patrimoine), conserver, 1);
  const refPct = (conserver / maxV) * 100;
  return (
    <div className="snow-chart">
      <div className="snow-ref" style={{ bottom: "calc(26px + " + (refPct * 0.78) + "% )" }}>
        <span className="snow-ref-tag mono">{F.k(conserver)}</span>
      </div>
      <div className="snow-bars">
        {cycles.map((c, i) => {
          const pct = (c.patrimoine / maxV) * 100;
          return (
            <div className="snow-bar" key={i}>
              <div className="sb-val mono">{F.k(c.patrimoine)}</div>
              <div className="sb-track">
                <div className="sb-fill" style={{ height: Math.max(6, pct * 0.78) + "%" }} />
              </div>
              <div className="sb-cap">
                <b>{c.biens} bien{c.biens > 1 ? "s" : ""}</b>
                <span>an {c.annee}</span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* Pictogrammes de biens (parc rachetable) */
function PropertyIcons({ n, cap }) {
  const max = cap || 8;
  const show = Math.min(n, max);
  const extra = n - show;
  return (
    <div className="prop-icons">
      {Array.from({ length: show }).map((_, i) => (
        <span className="prop-ic" key={i}>
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <path d="M2 6.5 7.5 2l5.5 4.5V13H2V6.5Z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round" />
            <rect x="6" y="8.5" width="3" height="4.5" fill="currentColor" />
          </svg>
        </span>
      ))}
      {extra > 0 && <span className="prop-more mono">+{extra}</span>}
    </div>
  );
}

function ReinvestScreen({ state, mode, H, back, openHypo, params }) {
  const inputs = useMemo(() => window.Engine.buildInputs(state, "b"), [state]);
  const timing = useMemo(() => window.Engine.resaleTimingLocatif(inputs, H), [inputs, H]);
  const structs = timing.structures;

  const initSid = (params && params.structureId) || state.locatif.structure || structs[0].id;
  const [sid, setSid] = useState(structs.some(s => s.id === initSid) ? initSid : structs[0].id);
  const sel = structs.find(s => s.id === sid) || structs[0];

  const [year, setYear] = useState((params && params.resaleYear) || sel.optimalYear);

  const d = useMemo(
    () => window.Engine.reinvestStrategy(inputs, H, sid, year),
    [inputs, H, sid, year]
  );

  const gainVsConserver = d.cycles[d.cycles.length - 1].patrimoine - d.conserver;

  function pickStruct(id) {
    const s = structs.find(x => x.id === id);
    setSid(id);
    setYear(s.optimalYear);   // recale sur la revente optimale de la structure choisie
  }

  return (
    <div className="app-root">
      <StatusBar />
      <AppBar kicker="Mode B · Locatif" title="Stratégie de remploi" onBack={back} />
      <div className="body page" style={{ paddingTop: 4 }}>
        <p className="screen-intro">
          Revendre dégage un capital net. Réinvesti avec le même effet de levier,
          il finance le rachat de plusieurs biens : c'est l'effet « boule de neige ».
        </p>

        {/* sélecteur de structure */}
        <div className="chip-scroll">
          {structs.map(s => (
            <button key={s.id} className={"struct-chip" + (s.id === sid ? " on" : "")} onClick={() => pickStruct(s.id)}>
              <span className={"sc-fam " + s.family}>{s.family === "is" ? "IS" : "IR"}</span>
              <span className="sc-name">{s.name.replace("Nom propre — ", "")}</span>
            </button>
          ))}
        </div>

        {/* hero : capital net dégagé */}
        <div className="timing-hero remploi-hero">
          <div className="th-k">Capital net dégagé à la revente</div>
          <div className="th-v">{F.k(d.capitalNet)}</div>
          <div className="th-sub">
            année {d.ry} · après impôt de PV <b>{F.euro(d.impotPV)}</b> · ×<b>{F.num(d.multiple, 2)}</b> l'apport
          </div>
        </div>

        {/* curseur année de revente */}
        <div className="card sect-gap">
          <div className="sf-top" style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10 }}>
            <span className="card-title">Année de revente</span>
            <span className="sf-val mono" style={{ color: "var(--accent)", fontWeight: 700, fontSize: 14 }}>
              {year} ans{year === sel.optimalYear ? " · optimal" : ""}
            </span>
          </div>
          <input type="range" className="slider" min={1} max={25} step={1} value={year}
            onChange={e => setYear(parseInt(e.target.value, 10))} />
          <div className="chart-x" style={{ color: "var(--ink-2)", marginTop: 6 }}>
            <span>1</span><span>5</span><span>10</span><span>15</span><span>20</span><span>25 ans</span>
          </div>
        </div>

        {/* capacité de rachat via levier */}
        <div className="card sect-gap">
          <span className="card-title">Capacité de rachat par effet de levier</span>
          <div className="card-sub" style={{ margin: "2px 0 14px" }}>
            Apport réinvesti à {F.pct(d.apportRate * 100, 0)} du prix de revient
          </div>
          <div className="lev-flow">
            <div className="lev-step">
              <div className="ls-k">Capital</div>
              <div className="ls-v mono">{F.k(d.capitalNet)}</div>
            </div>
            <svg className="lev-arrow" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 9h11m0 0-4-4m4 4-4 4" stroke="var(--ink-2)" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" /></svg>
            <div className="lev-step">
              <div className="ls-k">Capacité d'achat</div>
              <div className="ls-v mono">{F.k(d.capaciteValeur)}</div>
            </div>
            <svg className="lev-arrow" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 9h11m0 0-4-4m4 4-4 4" stroke="var(--ink-2)" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" /></svg>
            <div className="lev-step accent">
              <div className="ls-k">Biens</div>
              <div className="ls-v mono">{d.nbMax}</div>
            </div>
          </div>
          <div className="prop-row">
            <PropertyIcons n={d.nbMax} cap={8} />
            <span className="prop-note">≈ {F.k(d.coutTotal)} / bien similaire</span>
          </div>
        </div>

        {/* boule de neige */}
        <div className="card lg sect-gap">
          <span className="card-title">Effet boule de neige</span>
          <div className="card-sub" style={{ margin: "2px 0 6px" }}>
            Deux cycles de revente-rachat, chacun sur {d.ry} ans
          </div>
          <SnowballChart cycles={d.cycles} conserver={d.conserver} />
          <div className="proj-legend" style={{ marginTop: 10 }}>
            <span><span className="lg-swatch" style={{ borderColor: "var(--accent)", borderTopWidth: 9, height: 9, width: 12, borderRadius: 3 }} />Patrimoine remployé</span>
            <span><span className="lg-swatch lg-dash" style={{ borderColor: "var(--ink-2)" }} />Conserver 1 bien</span>
          </div>
          <div className={"remploi-delta " + (gainVsConserver >= 0 ? "pos" : "neg")}>
            <span className="rd-label">Patrimoine à {d.horizon} ans vs conserver un seul bien</span>
            <span className="rd-val mono">{F.signedEuro(gainVsConserver)}</span>
          </div>
        </div>

        {/* capital dégagé selon l'année */}
        <div className="card sect-gap">
          <span className="card-title">Capital dégagé selon l'année de revente</span>
          <div className="hz-table">
            <div className="hz-row head"><span>Durée</span><span>Impôt PV</span><span style={{ gridColumn: "span 2", textAlign: "right" }}>Capital net</span></div>
            {d.scenarios.map(s => (
              <div key={s.year} className={"hz-row" + (s.year === year ? " opt" : "")} onClick={() => setYear(s.year)} style={{ cursor: "pointer" }}>
                <div className="hz-yr">{s.year} ans{s.isOptimal && <div className="hz-star">optimal</div>}</div>
                <div className="hz-cell sub">{F.euro(s.impotPV)}</div>
                <div className="hz-cell" style={{ gridColumn: "span 2", textAlign: "right", color: "var(--accent)", fontWeight: 700 }}>{F.k(s.capital)}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="note-card">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#5B5BF0" strokeWidth="1.3" /><path d="M8 4.6v.2M8 7v4.4" stroke="#5B5BF0" strokeWidth="1.5" strokeLinecap="round" /></svg>
          <p>Le remploi suppose un réinvestissement à conditions de marché et de financement constantes. {d.note}</p>
        </div>

        <div className="hypo-row">
          <HypoChip h={H.ps} onEdit={() => openHypo("ps")} />
          <p className="hypo-note">Capacité indicative · levier &amp; conditions bancaires à confirmer.</p>
        </div>
        <Disclaimer />
      </div>
    </div>
  );
}

Object.assign(window, { ReinvestScreen });
</script>

<script type="text/babel">
/* ============================================================
   APP — routeur, état partagé, navigation
   ============================================================ */
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

function App() {
  const D = window.Engine.DEFAULTS;
  const [state, setState] = useState(() => ({
    bien: deepClone(D.bien), common: deepClone(D.common),
    locatif: deepClone(D.locatif), revente: deepClone(D.revente)
  }));
  const [H, setH] = useState(() => deepClone(window.Engine.HYPOTHESES));
  const [mode, setMode] = useState("b");
  const [route, setRoute] = useState("selector");
  const [hist, setHist] = useState([]);
  const [routeParams, setRouteParams] = useState({});
  const [hypoSheet, setHypoSheet] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const bodyKey = useRef(0);

  // restore last position
  useEffect(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("nbc-nav") || "null");
      if (saved && saved.route) { setRoute(saved.route); setMode(saved.mode || "b"); }
    } catch (e) {}
  }, []);
  useEffect(() => {
    localStorage.setItem("nbc-nav", JSON.stringify({ route, mode }));
  }, [route, mode]);

  function go(next, params) { setHist(h => [...h, route]); setRouteParams(params || {}); setRoute(next); }
  function back() {
    setHist(h => {
      if (!h.length) {
        // arrivée directe (route restaurée) : repli sûr pour ne jamais piéger l'utilisateur
        const top = (route === "dashA" || route === "dashB" || route === "common" || route === "selector");
        setRoute(top ? "selector" : (mode === "a" ? "dashA" : "dashB"));
        return h;
      }
      const copy = [...h]; const prev = copy.pop(); setRoute(prev); return copy;
    });
  }
  function update(section, patch) { setState(s => ({ ...s, [section]: { ...s[section], ...patch } })); }
  function setHypo(key, val) { setH(prev => ({ ...prev, [key]: { ...prev[key], val } })); }
  function switchMode(m) { setMode(m); setRoute(m === "a" ? "dashA" : "dashB"); }
  function toast(msg) { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2400); }

  const common = { state, update, mode, H, go, back, params: routeParams, openHypo: setHypo ? (k) => setHypoSheet(k) : null };

  let screen;
  switch (route) {
    case "selector": screen = <SelectorScreen mode={mode} setMode={setMode} go={go} />; break;
    case "common":   screen = <CommonScreen {...common} />; break;
    case "inputA":   screen = <InputAScreen state={state} update={update} go={go} back={back} />; break;
    case "inputB":   screen = <InputBScreen state={state} update={update} go={go} back={back} />; break;
    case "dashA":    screen = <DashAScreen {...common} onSwitch={switchMode} />; break;
    case "dashB":    screen = <DashBScreen {...common} onSwitch={switchMode} />; break;
    case "regimes":  screen = <StructuresScreen {...common} toast={toast} />; break;
    case "structures": screen = <StructuresScreen {...common} toast={toast} />; break;
    case "timing":   screen = <ResaleTimingScreen {...common} />; break;
    case "reinvest": screen = <ReinvestScreen {...common} />; break;
    case "scenarios":screen = <ScenariosScreen state={state} mode={mode} H={H} back={back} />; break;
    case "report":   screen = <ReportScreen state={state} mode={mode} H={H} back={back} toast={toast} />; break;
    default:         screen = <SelectorScreen mode={mode} setMode={setMode} go={go} />;
  }

  return (
    <div className="app-stage">
      <div className="phone">
        <div className="notch" />
        <div className="screen">
          {screen}
          {hypoSheet && <HypoSheet hkey={hypoSheet} H={H} onChange={setHypo} onClose={() => setHypoSheet(null)} />}
          {toastMsg && <div className="toast">{toastMsg}</div>}
          <div className="home-ind" />
        </div>
      </div>
      <div className="hint">
        Prototype navigable · saisies live · <kbd>R</kbd> réinitialiser
      </div>
    </div>
  );
}

// reset shortcut
window.addEventListener("keydown", e => {
  if (e.key === "r" && !/input|textarea/i.test(document.activeElement.tagName)) {
    localStorage.removeItem("nbc-nav"); location.reload();
  }
});

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
